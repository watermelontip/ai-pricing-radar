:root {

  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;

  --silver: #8b949e;

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
  background: var(--bg);

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header {

header h1 { font-size: 2em; margin-bottom: 8px; }
header h1 span { color: var(--accent); }
header p { color: var(--text-secondary); font-size: 1.1em; }
.header-meta {

  gap: 16px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.header-badge {

  border-radius: 16px;
  font-size: 0.85em;
  background: rgba(88,166,255,0.15);
  color: var(--accent);

.badge {

}
.badge-provider { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); }

.filters {

  gap: 8px;
  margin-bottom: 24px;
}
.filter-btn {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.9em;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: rgba(88,166,255,0.15); border-color: var(--accent); color: var(--accent); }

.sort-row {

  align-items: center;
  margin-bottom: 12px;

.sort-row label { color: var(--text-secondary); font-size: 0.9em; }
.sort-select {

  border: 1px solid var(--border);
  border-radius: var(--radius);

table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
thead { background: var(--bg-tertiary); }
th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
th:hover { color: var(--text); }

td { padding: 10px 16px; border-top: 1px solid var(--border); }

.model-name { font-weight: 600; color: var(--text); }
.model-notes { color: var(--text-muted); font-size: 0.85em; margin-top: 2px; }
.price { font-family: "SF Mono", "Fira Code", monospace; }
.price-input { color: var(--green); }
.price-output { color: var(--orange); }
.context-badge {

  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.8em;
  background: var(--bg-tertiary);

  font-size: 1.2em;
  color: var(--text-muted);

}

.calc-group input[type="range"] { width: 100%; accent-color: var(--accent); }
.calc-value {

.calc-number {

  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);

  text-align: center;

.calc-unit { color: var(--text-muted); font-size: 0.85em; }

.result-card {

  return (model.inputPrice * inTok / 1000000) + (model.outputPrice * outTok / 1000000);
}

// ============ 渲染筛选栏 ============
function renderFilters() {
  const cats = [
    { id:"all", label:"全部" },
    { id:"cheap", label:"💰 最便宜" },
    { id:"code", label:"💻 代码" },
    { id:"vision", label:"👁️ 视觉" },
    { id:"long", label:"📚 长上下文" },
    { id:"reasoning", label:"🧠 推理" },
  ];
  const providers = [...new Set(MODELS.map(m=>m.provider))];
  const html = cats.map(c =>
    `<button class="filter-btn ${state.filter===c.id?'active':''}" data-filter="${c.id}">${c.label}</button>`
  ).join("") + `<span style="margin-left:8px;color:var(--text-muted)">|</span>` +
  providers.map(p =>
    `<button class="filter-btn ${state.filter===('p:'+p)?'active':''}" data-filter="p:${p}">${p}</button>`
  ).join("");
  document.getElementById("filters").innerHTML = html;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.filter = btn.dataset.filter; render(); });
  });
}

// ============ 渲染表格 ============
function renderTable() {
  let models = [...MODELS];
  // 筛选
  if (state.filter === "cheap") models = models.filter(m => m.category.includes("cheap"));
  else if (state.filter === "code") models = models.filter(m => m.category.includes("code"));
  else if (state.filter === "vision") models = models.filter(m => m.category.includes("vision"));
  else if (state.filter === "long") models = models.filter(m => m.category.includes("long"));
  else if (state.filter === "reasoning") models = models.filter(m => m.category.includes("reasoning"));
  else if (state.filter.startsWith("p:")) models = models.filter(m => m.provider === state.filter.slice(2));
  // 排序
  const s = state.sort;
  const d = state.sortDir;
  models.sort((a,b) => {
    if (s === "name" || s === "provider" || s === "released") return d * String(a[s]).localeCompare(String(b[s]));
    return d * (a[s] - b[s]);
  });
  // 渲染
  document.getElementById("model-count").textContent = models.length;
  const tbody = document.getElementById("model-table");
  tbody.innerHTML = models.map(m => {
    const starred = state.starred.includes(m.id);
    const features = m.features.map(f => {
      const labels = {vision:"👁️视觉",tools:"🔧工具",json:"📋JSON",reasoning:"🧠推理"};
      return `<span class="badge badge-feature">${labels[f]||f}</span>`;
    }).join(" ");
    return `<tr>
      <td><button class="star-btn ${starred?'starred':''}" data-id="${m.id}">${starred?'★':'☆'}</button></td>
      <td>
        <div class="model-name">${m.name}</div>
        <div class="model-notes">${m.notes}</div>
      </td>
      <td><span class="badge badge-provider">${m.provider}</span></td>
      <td class="price price-input">${fmtPrice(m.inputPrice)}/1M</td>
      <td class="price price-output">${fmtPrice(m.outputPrice)}/1M</td>
      <td><span class="context-badge">${fmt(m.contextWindow)}</span></td>
      <td>${features}</td>
    </tr>`;
  }).join("");
  // 星标事件
  tbody.querySelectorAll(".star-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (state.starred.includes(id)) state.starred = state.starred.filter(s=>s!==id);
      else state.starred.push(id);
      localStorage.setItem("starred", JSON.stringify(state.starred));
      render();
    });
  });
}

// ============ 渲染计算器 ============
function renderCalc() {
  const inTok = state.inputTokens;
  const outTok = state.outputTokens;
  const costs = MODELS.map(m => ({
    ...m,
    monthly: monthlyCost(m, inTok, outTok),
    inputCost: m.inputPrice * inTok / 1000000,
    outputCost: m.outputPrice * outTok / 1000000,
  })).sort((a,b) => a.monthly - b.monthly).slice(0, 6);
  const ranks = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣"];
  const grid = document.getElementById("calc-results");
  grid.innerHTML = costs.map((c, i) => {
    const cls = i===0?"top1":i===1?"top2":i===2?"top3":"";
    return `<div class="result-card ${cls}">
      <div class="result-rank">${ranks[i]}</div>
      <div class="result-model">${c.name}</div>
      <div class="result-provider">${c.provider}</div>
      <div class="result-price ${cls}">${fmtPrice(c.monthly)}/月</div>
      <div class="result-breakdown">输入 ${fmtPrice(c.inputCost)} + 输出 ${fmtPrice(c.outputCost)}</div>
    </div>`;
  }).join("");
}

// ============ 渲染场景 ============
function renderScenarios() {
  const grid = document.getElementById("scenarios");
  grid.innerHTML = SCENARIOS.map(s =>
    `<div class="scenario-card" data-id="${s.id}">
      <div class="scenario-icon">${s.icon}</div>
      <div class="scenario-name">${s.name}</div>
      <div class="scenario-desc">${s.desc}</div>
    </div>`
  ).join("");
  grid.querySelectorAll(".scenario-card").forEach(card => {
    card.addEventListener("click", () => {
      const sc = SCENARIOS.find(s=>s.id===card.dataset.id);
      if (!sc) return;
      state.inputTokens = sc.inputTokens;
      state.outputTokens = sc.outputTokens;
      document.getElementById("input-tokens").value = sc.inputTokens;
      document.getElementById("output-tokens").value = sc.outputTokens;
      document.getElementById("input-tokens-num").value = fmt(sc.inputTokens);
      document.getElementById("output-tokens-num").value = fmt(sc.outputTokens);
      grid.querySelectorAll(".scenario-card").forEach(c=>c.classList.remove("active"));
      card.classList.add("active");
      const costs = MODELS.map(m => ({...m, monthly: monthlyCost(m, sc.inputTokens, sc.outputTokens)}))
        .sort((a,b)=>a.monthly-b.monthly);
      const cheapest = costs[0];
      const best = costs.filter(m=>m.category.includes(sc.id==="vision"?"vision":"code")).sort((a,b)=>a.monthly-b.monthly)[0] || cheapest;
      document.getElementById("scenario-result").innerHTML = `
        <div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
          <p style="color:var(--text-secondary);margin-bottom:8px;">
            <strong style="color:var(--text);">${sc.icon} ${sc.name}</strong> 场景推荐：
            输入 ${fmt(sc.inputTokens)} tokens + 输出 ${fmt(sc.outputTokens)} tokens
          </p>
          <p>💰 <strong style="color:var(--green);">性价比之王</strong>: ${cheapest.name} (${cheapest.provider}) — <span style="color:var(--gold);font-weight:700;">${fmtPrice(cheapest.monthly)}/月</span></p>
          ${best.id!==cheapest.id ? `<p>⭐ <strong style="color:var(--accent);">该场景最优</strong>: ${best.name} (${best.provider}) — <span style="color:var(--accent);font-weight:700;">${fmtPrice(best.monthly)}/月</span></p>` : ""}
        </div>`;
      renderCalc();
    });
  });
}

// ============ 主渲染 ============
function render() {
  renderFilters();
  renderTable();
  renderCalc();
}

// ============ 事件绑定 ============
function init() {
  const inSlider = document.getElementById("input-tokens");
  const outSlider = document.getElementById("output-tokens");
  const inNum = document.getElementById("input-tokens-num");
  const outNum = document.getElementById("output-tokens-num");
  inSlider.addEventListener("input", () => {
    state.inputTokens = +inSlider.value;
    inNum.value = fmt(state.inputTokens);
    renderCalc();
  });
  outSlider.addEventListener("input", () => {
    state.outputTokens = +outSlider.value;
    outNum.value = fmt(state.outputTokens);
    renderCalc();
  });
  inNum.addEventListener("change", () => {
    const v = parseInt(inNum.value.replace(/[KMkm]/g, "")) * (inNum.value.toUpperCase().includes("M")?1000000:inNum.value.toUpperCase().includes("K")?1000:1);
    if (!isNaN(v)) { state.inputTokens = v; inSlider.value = v; renderCalc(); }
  });
  outNum.addEventListener("change", () => {
    const v = parseInt(outNum.value.replace(/[KMkm]/g, "")) * (outNum.value.toUpperCase().includes("M")?1000000:outNum.value.toUpperCase().includes("K")?1000:1);
    if (!isNaN(v)) { state.outputTokens = v; outSlider.value = v; renderCalc(); }
  });
  document.getElementById("sort-select").addEventListener("change", (e) => {
    if (state.sort === e.target.value) state.sortDir *= -1;
    else { state.sort = e.target.value; state.sortDir = 1; }
    render();
  });
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (state.sort === key) state.sortDir *= -1;
      else { state.sort = key; state.sortDir = 1; }
      document.getElementById("sort-select").value = key;
      render();
    });
  });
  render();
  renderScenarios();
}

init();
</script>
</body>
</html>
